version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Jakarta
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 10
    groups:
      nestjs-minor-and-patch:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
