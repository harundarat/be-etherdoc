name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: etherdoc_test
          POSTGRES_PASSWORD: etherdoc_test
          POSTGRES_USER: etherdoc
        options: >-
          --health-cmd "pg_isready -U etherdoc -d etherdoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://etherdoc:etherdoc_test@127.0.0.1:5432/etherdoc_test
    steps:
      - name: Check out backend
        uses: actions/checkout@v4
        with:
          path: be-etherdoc

      - name: Check out contract baseline
        uses: actions/checkout@v4
        with:
          repository: harundarat/sc-etherdoc
          # Includes the public deployment manifests, which pin the deployed
          # Solidity inputs to b132bf4360108db00959fc5aa75009a12283ed69.
          ref: 391053981c1513b2123ec0c1f751271597c76742
          fetch-depth: 0
          submodules: recursive
          path: sc-etherdoc

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Compile contract artifacts
        working-directory: sc-etherdoc
        run: forge build

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: be-etherdoc/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: be-etherdoc
        run: pnpm install --frozen-lockfile

      - name: Reject contract artifact drift
        working-directory: be-etherdoc
        env:
          ETHERDOC_CONTRACTS_DIR: ../sc-etherdoc
        run: pnpm contracts:check

      - name: Lint without writing
        working-directory: be-etherdoc
        run: pnpm lint:check

      - name: Test
        working-directory: be-etherdoc
        run: pnpm test --runInBand

      - name: Run migrations twice
        working-directory: be-etherdoc
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: Test PostgreSQL integration
        working-directory: be-etherdoc
        run: pnpm test:integration

      - name: Test deterministic HTTP API
        working-directory: be-etherdoc
        run: pnpm test:e2e

      - name: Build
        working-directory: be-etherdoc
        run: pnpm build
