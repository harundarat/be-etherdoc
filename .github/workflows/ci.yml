name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    # ubuntu-24.04 includes PostgreSQL 16 with its service disabled. Starting
    # that local service avoids a pre-job Docker Hub pull that cannot be
    # retried or diagnosed from workflow steps.
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://etherdoc:etherdoc_test@127.0.0.1:5432/etherdoc_test
    steps:
      - name: Check out backend
        uses: actions/checkout@v4
        with:
          path: be-etherdoc

      - name: Start PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          postgres_major="$(sudo -u postgres psql --tuples-only --no-align --command 'SHOW server_version_num' | cut -c1-2)"
          if [ "$postgres_major" != "16" ]; then
            echo "::error::Expected PostgreSQL 16, found major $postgres_major"
            exit 1
          fi
          sudo -u postgres psql --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE etherdoc LOGIN PASSWORD 'etherdoc_test';
          CREATE DATABASE etherdoc_test OWNER etherdoc;
          SQL
          PGPASSWORD=etherdoc_test pg_isready \
            --host 127.0.0.1 \
            --port 5432 \
            --username etherdoc \
            --dbname etherdoc_test
          psql "$DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --command 'SELECT current_database(), current_user;'

      - name: Check out contract baseline
        uses: actions/checkout@v4
        with:
          repository: harundarat/sc-etherdoc
          # Includes the public deployment manifests, which pin the deployed
          # Solidity inputs to b132bf4360108db00959fc5aa75009a12283ed69.
          ref: 391053981c1513b2123ec0c1f751271597c76742
          fetch-depth: 0
          submodules: recursive
          path: sc-etherdoc

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Compile contract artifacts
        working-directory: sc-etherdoc
        run: forge build

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: be-etherdoc/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: be-etherdoc
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: be-etherdoc
        run: pnpm audit:prod

      - name: Reject contract artifact drift
        working-directory: be-etherdoc
        env:
          ETHERDOC_CONTRACTS_DIR: ../sc-etherdoc
        run: pnpm contracts:check

      - name: Check TypeScript
        working-directory: be-etherdoc
        run: pnpm typecheck

      - name: Lint without writing
        working-directory: be-etherdoc
        run: pnpm lint:check

      - name: Test
        working-directory: be-etherdoc
        run: pnpm test --runInBand

      - name: Enforce coverage thresholds
        working-directory: be-etherdoc
        run: pnpm test:coverage

      - name: Run migrations twice
        working-directory: be-etherdoc
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: Test PostgreSQL integration
        working-directory: be-etherdoc
        run: pnpm test:integration

      - name: Test deterministic HTTP API
        working-directory: be-etherdoc
        run: pnpm test:e2e

      - name: Build
        working-directory: be-etherdoc
        run: pnpm build

      - name: Verify production-only install
        working-directory: be-etherdoc
        shell: bash
        run: |
          production_dir="$(mktemp -d)"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$production_dir/"
          cp -R dist "$production_dir/dist"
          cd "$production_dir"
          pnpm install --prod --frozen-lockfile
          node -e "const { AppModule } = require('./dist/app.module.js'); if (!AppModule) process.exit(1)"
